  - id: A1
    source: brief.md
    text: "Scenario: A1 默认全量禁用（仅限 ACP） - GIVEN 一个未配置过 ACP 的项目 - WHEN 用户打开 ACP 状态面板，或
      AI 会话初始化 - THEN 所有 ACP 大类与子工具均显示为未启用（0/N 启用），大模型工具列表不包含任何未授权 ACP 工具（MCP
      既有默认策略保持不变）"
    result: passed
    reason:
      text: ACP 默认全量禁用（0/N 启用），模型会话严格过滤未授权工具，测试 100% 通过。
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: A2 ACP 与 MCP 关闭状态下独立开启子工具并智能级联激活 - GIVEN 某个 ACP 大类或某个 MCP
      Server 当前处于关闭/未启用状态（0/N 启用） - WHEN 用户展开该卡片并点击其中一个子工具的开关开启 - THEN
      该子工具变为开启，父级总开关（ACP 大类或 MCP Server）自动级联激活为开启，且其它子工具依然保持原有状态，不被全量勾选（1/N 启用）"
    result: passed
    reason:
      text: ACP/MCP 关闭状态下独立开启子工具，智能级联激活父级且仅开启该工具（1/N 启用），测试 100% 通过。
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: A3 ACP 与 MCP 关闭最后一个子工具自动闭合父级 - GIVEN 某个 ACP 大类或某个 MCP Server
      仅开启了 1 个子工具（1/N 启用） - WHEN 用户点击关闭该子工具 - THEN 该子工具变为关闭，父级总开关自动联动切换为关闭（0/N
      启用）"
    result: passed
    reason:
      text: ACP/MCP 仅开启 1 个子工具时，关闭该子工具自动联动关闭父级（0/N 启用），回滚与事务对齐测试 100% 通过。
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: A4 ACP 与 MCP 一键全部启用与全部禁用 - GIVEN 某个 ACP 大类或某个 MCP Server
      展开展示了多个子工具 - WHEN 用户点击“全部启用”或“全部禁用”快捷按钮 - THEN 该分类下的所有子工具批量同步为全开（N/N
      启用）或全关（0/N 启用）"
    result: passed
    reason:
      text: ACP 与 MCP 一键全部启用与全部禁用批量控制正常，慢请求与全结算回滚测试 100% 通过。
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: A5 VS Code 与 IntelliJ IDEA 双端配置命名空间隔离与平滑回退 - GIVEN 同一个项目分别在 VS
      Code 和 IntelliJ IDEA 中打开并配置了各自的 ACP 开关 - WHEN 保存配置到 opencode.json - THEN
      双方的配置分别存储在 acp.platform_vscode 与 acp.platform_intellij
      下，互不覆盖，且对历史无平台命名前缀的扁平配置提供平滑读取兼容"
    result: passed
    reason:
