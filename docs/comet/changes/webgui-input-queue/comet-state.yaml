  - id: A2
    source: brief.md
    text: A2：当前响应与关联工具完成后，只批量接收列表开头连续的补充消息并按顺序作为独立 user 消息进入下一次 LLM
      请求；排队消息后的补充不得越过屏障，边界后到达的输入等待后续边界；当前响应自然 stop 时仍处理符合顺序的已接收补充。
    result: pending
    reason: null
  - id: A3
    source: brief.md
    text: A3：排队消息不进入当前任务的工具后续上下文；当前任务自然结束后只启动列表最前的一条排队消息，其执行边界后才允许处理位于其后的补充，完成该条任务后再考虑下一条排队消息；含工具调用的
      provider stop 不被误判为任务完成。
    result: pending
    reason: null
  - id: A4
    source: brief.md
    text: A4：两种模式共享服务端顺序列表，默认为展开状态并展示全部待发送项及总数，支持手动收起后仅展示首条；补充项显示“转排队／上移／删除”，排队项显示“转补充／上移／删除”，第一项不显示上移，当前模式按钮隐藏；空列表不占位，已消费项移入正式对话；删除成功的任意待发送项按确认结果回填输入框或丢弃。
    result: pending
    reason: null
  - id: A5
    source: brief.md
    text: A5：模式切换保持
      ID、内容和顺序；上移将当前待发送项与前一项原子交换并同步到多窗口，用户把补充移到排队消息前后该补充才可提前释放；删除只在服务端确认成功后回填完整文本和附件，与消费竞争失败时不修改草稿；重排、转换、删除与消费竞争时服务端只接受一个结果，已消费项不可伪装成操作成功。
    result: pending
    reason: null
  - id: A6
    source: brief.md
    text: A6：第一次手动停止即暂停待发送列表，优雅收尾和确认强制终止均不自动消费剩余消息；停止过程中仍可编辑或提交到暂停列表，模式转换不启动
      AI，保留既有两阶段停止和审批拒绝行为。
    result: pending
    reason: null
  - id: A7
    source: brief.md
    text: A7：停止结束后“发送下一条”按展示顺序启动第一条并恢复自动消费，运行中不可重复启动；暂停时手动发送一条新草稿会立即解除暂停，旧列表按既有顺序和模式在后续安全边界自动消费；空列表不显示恢复操作。
    result: pending
    reason: null
