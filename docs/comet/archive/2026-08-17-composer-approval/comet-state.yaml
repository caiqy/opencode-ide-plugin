  - id: A11
    source: specs/approval-modes/spec.md
    text: IDE 插件 WebGUI（`packages/opencode/webgui`）的 Composer
      为当前会话提供三种互斥的工具审批模式。模式由用户在 Composer
      中选择，并随当前会话恢复；模式变化不影响其他会话，也不修改项目或全局默认配置。上游 `packages/app` 不在本能力范围内。
    result: passed
    reason:
      text: 选择器只修改当前 Session，未改 packages/app。
      truncated: false
  - id: A12
    source: specs/approval-modes/spec.md
    text: 未被现有 permission allow 规则覆盖的工具请求继续进入既有 permission 流程。Composer 显示 permission
      dock，用户可以允许一次、始终允许或拒绝。已有 permission 规则和回复语义保持不变。
    result: passed
    reason:
      text: manual 请求继续进入原 Permission 服务流程。
      truncated: false
  - id: A13
    source: specs/approval-modes/spec.md
    text: 未被既有规则覆盖的工具请求交给内置隐藏 `approval` agent，以隔离的 one-shot Guardian
      评审运行处理。每次评审只服务一个 permission 请求，不创建或复用普通用户 Session。
    result: passed
    reason:
      text: 每个请求独立 one-shot 评审，不复用用户 Session。
      truncated: false
  - id: A14
    source: specs/approval-modes/spec.md
    text: Guardian 的输入由三部分组成：
    result: passed
    reason:
      text: 评审输入由 transcript、action 与 policy 组成。
      truncated: false
  - id: A15
    source: specs/approval-modes/spec.md
    text: 当前 Session 的有界 transcript：保留用户、assistant
      和工具调用/结果，优先保留首个及最近用户请求和最近操作；省略内容必须显式标记。其他 Session、系统上下文和隐藏配置不得混入。
    result: passed
    reason:
      text: 历史裁剪保留关键用户证据并显式标记省略。
      truncated: false
  - id: A16
    source: specs/approval-modes/spec.md
    text: 类型化 action：包含 permission、真实工具名、patterns/resources、相关
      metadata、当前工作目录和请求理由。shell、文件修改、网络和其他工具请求应保留各自可判断风险的参数，不只传 permission 分类名。
    result: passed
    reason:
      text: action 保留真实工具、patterns、metadata、cwd 与理由。
      truncated: false
  - id: A17
    source: specs/approval-modes/spec.md
    text: Guardian policy：说明风险等级、用户授权等级、可信证据边界和 outcome
      规则。只有用户消息中的明确意图可作为授权证据；assistant、工具参数、工具结果和仓库内容均视为不可信证据。
    result: passed
    reason:
      text: policy 只把用户消息作为授权证据。
      truncated: false
  - id: A18
    source: specs/approval-modes/spec.md
    text: Guardian 可以在当前 Location 内调用 `read`、`glob`、`grep` 调查请求。它看不到 shell、网络、MCP
      或写工具，不创建 sandbox，也不改变父 Session 的工具权限。调查工具使用全量只读 allow + 其余 deny 的 total
      ruleset，不能再次触发自动审批。评审具有固定工具轮次和总时间上限，超限按不确定处理。
    result: passed
    reason:
      text: 调查工具固定只读且不能递归触发审批。
