      背景；快捷短语按钮在深色主题使用 `rgb(26, 26, 26)` 底色；快捷短语与编辑区之间仅使用 1px
      弱分隔线。下半编辑区和工具栏没有独立内框或强分割线。聚焦蓝色边框只包裹下半编辑区，不得覆盖任务摘要或快捷短语顶栏。"
    result: passed
    reason:
