acceptance:
  - id: A1
    source: brief.md
    text: "A1: 配置可声明有序的 OpenAI、Anthropic、xAI 搜索模型；未配置或显式关闭时维持现有 Exa/Parallel
      `websearch` 行为。"
    result: passed
    reason:
      text: 有序 provider/model 配置和 legacy Exa/Parallel 行为已验证。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 当前对话模型厂商存在可用搜索路由时优先选择该厂商；否则按配置顺序选择首个可用路由，不把主模型请求直接转发给另一厂商。"
    result: passed
    reason:
      text: 当前 provider 优先及配置顺序 fallback 已验证。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: OpenAI 搜索请求使用 Responses `web_search`，Anthropic 搜索请求使用 Messages server
      tool，xAI 搜索请求使用 Responses `web_search`。"
    result: passed
    reason:
      text: OpenAI、Anthropic、xAI 的 native search declaration 已验证。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 搜索请求是独立 provider turn；provider-executed 搜索调用由内部搜索运行时消费，不在当前会话触发本地
      dispatch，最终回答和引用作为当前 `websearch` 工具结果返回。"
    result: passed
    reason:
      text: 独立 provider turn 和本地 websearch 结果投影已验证。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 首选搜索路由不可用或调用失败时尝试下一条配置路由；全部失败时返回包含稳定摘要、但不泄露凭据的工具错误。"
    result: passed
    reason:
      text: 按序 fallback 和稳定脱敏错误已验证。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 原生搜索模式启用时，现有 Exa/Parallel 执行路径不暴露给模型；关闭原生模式后现有行为不变。"
    result: passed
    reason:
      text: native 模式隐藏 Exa/Parallel，关闭后恢复 legacy 行为已验证。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 相关协议、路由选择、工具执行和结果投影测试通过，覆盖普通对话模型与搜索厂商不同、同厂商优先和全部路由失败。"
    result: passed
    reason:
      text: 协议、路由、runtime、权限及回归检查证据齐全。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: `websearch.mode` 可选择 `responses` 或 `alpha-search`；未配置 mode 时保持
      `responses` 行为。"
    result: passed
    reason:
      text: responses 和 alpha-search mode 及 responses 默认值已验证。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: `alpha-search` 仅选择 OpenAI 路由，向规范化后的 provider URL `/alpha/search` 发送带
      Bearer credentials 的请求；模型 URL 为空时使用 provider `options.baseURL`。"
    result: passed
    reason:
      text: OpenAI-only、model api.url 优先、provider baseURL fallback、/alpha/search 和
        Bearer 鉴权已验证。
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: Alpha Search 返回的回答和 sources 投影为现有 `websearch` 工具结果；私有 citation
      标记不会泄露给当前模型。"
    result: passed
    reason:
      text: Alpha output/results 投影及私有 citation marker 清理已验证。
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: Alpha Search 的配置解析、URL fallback、失败 fallback 和真实运行调用均有验证证据。"
    result: passed
    reason:
      text: Alpha Search 配置、URL fallback、失败 fallback 和真实 runtime 证据齐全。
      truncated: false
  - id: A12
    source: specs/native-web-search/spec.md
    text: When native search is enabled, configuration supplies an ordered list of
      explicit `provider/model` references. Supported providers are OpenAI,
      Anthropic, and xAI. Each entry identifies the model that performs the
      search; the implementation must not silently substitute a provider default
      model.
    result: passed
    reason:
      text: 有序 provider/model 配置严格解析和校验已验证。
      truncated: false
  - id: A13
    source: specs/native-web-search/spec.md
    text: The ordered list is the fallback order. When the active conversation
      model's provider is present and usable, that provider's search entry is
      attempted first. All other entries retain their configured order. A
      provider/model entry is usable only when its provider route and
      credentials can be resolved.
    result: passed
    reason:
      text: 同 provider 优先及跨 provider fallback 确定性已验证。
      truncated: false
  - id: A14
    source: specs/native-web-search/spec.md
    text: When native search is disabled or no native search routes are configured,
      the existing Exa/Parallel-backed `websearch` behavior remains unchanged.
    result: passed
    reason:
      text: 无 native 路由时 legacy 行为保持不变已验证。
      truncated: false
  - id: A15
    source: specs/native-web-search/spec.md
    text: The optional `mode` selects the native search transport. It defaults to
      `responses`. When `mode` is `alpha-search`, the configured route must use
      the OpenAI provider and the request is sent to the Alpha Search endpoint
      instead of the provider-native Responses or Messages declaration.
    result: passed
    reason:
      text: mode 对 native transport 的选择及 alpha-search 分支已验证。
      truncated: false
  - id: A16
    source: specs/native-web-search/spec.md
    text: For Alpha Search, the endpoint URL is resolved from the selected model's
      `api.url` first. When that URL is empty, the provider's `options.baseURL`
      is used. Trailing slashes are removed before appending `/alpha/search`.
      The request uses the provider credential as a Bearer token and must not
      expose the credential in tool output or diagnostics returned to the user.
    result: passed
    reason:
      text: Alpha URL 规范化、credential Bearer 使用和脱敏已验证。
      truncated: false
  - id: A17
    source: specs/native-web-search/spec.md
    text: Native search continues to be exposed to the conversation as the existing
      local `websearch` tool and keeps its existing permission boundary. The
      tool does not send a hosted search declaration in the conversation model's
      request. Instead, after permission succeeds, it starts one independent
      search-model request using the selected configured provider/model.
    result: passed
    reason:
      text: 权限检查和本地 websearch 工具边界已验证。
      truncated: false
  - id: A18
    source: specs/native-web-search/spec.md
    text: "The independent request uses the provider-native search declaration:"
    result: passed
    reason:
      text: 独立请求使用 provider-native search declaration 已验证。
      truncated: false
  - id: A19
    source: specs/native-web-search/spec.md
    text: "OpenAI: Responses API `web_search`."
    result: passed
    reason:
      text: OpenAI Responses web_search 已验证。
      truncated: false
  - id: A20
    source: specs/native-web-search/spec.md
    text: "Anthropic: Messages API `web_search_20250305` server tool."
    result: passed
    reason:
      text: Anthropic web_search_20250305 server tool 已验证。
      truncated: false
  - id: A21
    source: specs/native-web-search/spec.md
    text: "xAI: Responses API `web_search`."
    result: passed
    reason:
      text: xAI Responses web_search 已验证。
      truncated: false
  - id: A22
    source: specs/native-web-search/spec.md
    text: The independent request may be fulfilled by a different provider than the
      conversation model. The active conversation provider only affects
      priority; it never changes the configured search model or causes a request
      to be sent to the conversation provider without a matching configured
      entry.
    result: passed
    reason:
      text: 当前会话 provider 只影响排序，不替换搜索模型已验证。
      truncated: false
  - id: A23
    source: specs/native-web-search/spec.md
    text: If the preferred search route cannot be resolved or its request fails, the
      implementation tries the next configured route. It stops at the first
      successful search response. If all routes fail, the local tool returns one
      stable failure with provider and credential details redacted from
      user-facing text; diagnostics may retain typed provider context.
    result: passed
    reason:
      text: 失败路由继续 fallback，全部失败返回稳定脱敏错误已验证。
      truncated: false
  - id: A24
    source: specs/native-web-search/spec.md
    text: The tool result contains the search answer, citations/source metadata when
      the provider returns them, and the selected `provider/model` identity. The
      result is returned to the active conversation model as ordinary local tool
      output.
    result: passed
    reason:
      text: 回答、sources 和 provider/model identity 的工具结果投影已验证。
      truncated: false
  - id: A25
    source: specs/native-web-search/spec.md
    text: Alpha Search responses use the returned `output` as the answer and project
      returned `results` as sources. Private citation markers are removed before
      the result is returned to the active conversation model.
    result: passed
    reason:
      text: Alpha output/results 投影和 citation marker 清理已验证。
      truncated: false
  - id: A26
    source: specs/native-web-search/spec.md
    text: The active conversation performs one local `websearch` tool call. The
      internal search-model turn owns its provider-executed search events and
      does not expose them as dispatchable local calls in the active
      conversation. The active conversation runtime must not try to execute or
      redispatch the internal hosted search call.
    result: passed
    reason:
      text: provider-executed 搜索不进入当前会话本地 dispatch 已验证。
      truncated: false
  - id: A27
    source: specs/native-web-search/spec.md
    text: When native search mode is enabled, the model-visible Exa/Parallel
      execution path is hidden. Disabling native mode restores the prior local
      provider selection and behavior.
    result: passed
    reason:
      text: native/legacy 执行路径切换已验证。
      truncated: false
  - id: A28
    source: specs/native-web-search/spec.md
    text: Existing provider-executed event parsing, citation metadata, bounded
      output, permission checks, and tool rendering remain compatible.
      Unsupported models or routes do not receive a native search declaration.
      Ordinary local tools remain available and continue to use their existing
      lowering and execution paths.
    result: passed
    reason:
      text: 既有 citation parsing、权限、bounded output、事件和普通工具兼容性已验证。
      truncated: false
  - id: A29
    source: specs/native-web-search/spec.md
    text: "A1: Ordered explicit provider/model configuration is parsed and
      validated."
    result: passed
    reason:
      text: 对应 spec A1 的配置解析和校验已通过。
      truncated: false
  - id: A30
    source: specs/native-web-search/spec.md
    text: "A2: Same-provider preference and configured cross-provider fallback are
      deterministic."
    result: passed
    reason:
      text: 对应 spec A2 的路由优先级和 fallback 已通过。
      truncated: false
  - id: A31
    source: specs/native-web-search/spec.md
    text: "A3: Each supported provider receives its exact native search declaration."
    result: passed
    reason:
      text: 对应 spec A3 的三家 native declaration 已通过。
      truncated: false
  - id: A32
    source: specs/native-web-search/spec.md
    text: "A4: Independent search results and citations are projected into the local
      `websearch` result without dispatching hosted calls in the active
      session."
    result: passed
    reason:
      text: 对应 spec A4 的独立结果和 citations 投影已通过。
      truncated: false
  - id: A33
    source: specs/native-web-search/spec.md
    text: "A5: Failed routes fall back in order and all-route failure is stable and
      redacted."
    result: passed
    reason:
      text: 对应 spec A5 的失败 fallback 和脱敏错误已通过。
      truncated: false
  - id: A34
    source: specs/native-web-search/spec.md
    text: "A6: Native mode hides Exa/Parallel execution and disabled mode preserves
      it."
    result: passed
    reason:
      text: 对应 spec A6 的 native/legacy 路径行为已通过。
      truncated: false
  - id: A35
    source: specs/native-web-search/spec.md
    text: "A7: Focused protocol, routing, runtime, permission, and regression tests
      pass."
    result: passed
    reason:
      text: 对应 spec A7 的 focused tests、typecheck 和 diff check 已通过。
      truncated: false
  - id: A36
    source: specs/native-web-search/spec.md
    text: "A8: `websearch.mode` accepts `responses` and `alpha-search`, with
      `responses` as the default."
    result: passed
    reason:
      text: 对应 spec A8 的 mode 枚举和默认值已通过。
      truncated: false
  - id: A37
    source: specs/native-web-search/spec.md
    text: "A9: Alpha Search selects only OpenAI routes, resolves `api.url` before
      provider `options.baseURL`, appends `/alpha/search`, and sends Bearer
      credentials without exposing them."
    result: passed
    reason:
      text: 对应 spec A9 的 OpenAI-only、URL 优先级、endpoint 和 Bearer 鉴权已通过。
      truncated: false
  - id: A38
    source: specs/native-web-search/spec.md
    text: "A10: Alpha Search `output` and `results` are projected into the local
      `websearch` result, with private citation markers removed."
    result: passed
    reason:
      text: 对应 spec A10 的 output/results 投影和 citation 清理已通过。
      truncated: false
  - id: A39
    source: specs/native-web-search/spec.md
    text: "A11: Alpha Search configuration, URL fallback, route failure behavior,
      and a real runtime request are verified."
    result: passed
    reason:
      text: 对应 spec A11 的配置、URL fallback、失败行为和真实 runtime 验证已通过。
      truncated: false
