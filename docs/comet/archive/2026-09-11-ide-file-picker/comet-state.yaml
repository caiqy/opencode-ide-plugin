acceptance:
  - id: A1
    source: brief.md
    text: A1：在 VSCode
      插件环境下，点击“+（添加上下文）”展开浮层，选择“文件”调出原生文件选择器，选中的非图片文件以完整绝对路径插入，工作区内文件按规范以相对路径插入。
    result: passed
    reason:
      text: VSCode 文件选择返回 fsPath，工作区相对路径与外部绝对路径按既有规则插入。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：在 VSCode
      插件环境下，点击“+（添加上下文）”选择“文件夹”调出原生目录选择器，选中的外部目录以完整绝对路径插入，工作区内目录按规范以相对路径插入。
    result: passed
    reason:
      text: VSCode 目录模式唤起原生文件夹选择器，前端 pastePath 插入目录引用。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：在 JetBrains 插件环境下，点击“+（添加上下文）”能分别唤起文件或目录原生选择器，并把非图片文件与目录的路径按相同规则插入输入框。
    result: passed
    reason:
      text: JetBrains 按 mode 配置原生文件/目录选择器，路径插入规则一致。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：在任何 IDE 原生对话框中点击取消或关闭时，输入框保持原样，不报错、不插入空节点。
    result: passed
    reason:
      text: 取消返回 cancelled:true，前端静默返回，不插入节点不弹错。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：在没有 IDE Bridge
      的纯浏览器环境下，选择“文件”或“文件夹”能安全降级：图片以图片附件形式插入；非图片无法获得物理路径时以名称形式插入引用；不弹出“无法获取文件路径”错误。
    result: passed
    reason:
      text: 无 Bridge 时图片经 File API 转图片附件，非图片无路径以名称引用，不弹错。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：WebGUI 与 VSCode 插件端的新增与既有单元测试均通过，JetBrains 插件端完成源码与单测编译。
    result: passed
    reason:
      text: WebGUI 1573 用例、VSCode 243 用例通过，JetBrains unitTest BUILD
        SUCCESSFUL，与源码及测试相符。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：在 VSCode 与 JetBrains
      插件环境下，通过“文件”选中的图片以图片附件形式插入输入框，显示缩略图，且发送消息时图片内容随消息传递给模型（与粘贴图片一致），不再插入 @路径
      引用。
    result: passed
    reason:
      text: 图片经 readFiles 转 AttachmentNode（72×72 缩略图），Data URL 随 session.prompt 发送给模型。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：IDE 宿主读取图片内容失败时，该图片回退为 @路径 引用插入，不弹出错误提示。
    result: passed
    reason:
