acceptance:
  - id: A1
    source: brief.md
    text: A1：在 WebGUI 对话中当 AI 正在生成时，点击停止按钮触发优雅打断，按钮变为红色微动状态，输入框上方展示等待收尾的提示横幅，Tooltip
      变为“已请求停止，再次点击强制打断”。
    result: passed
    reason:
      text: 首次点击触发优雅打断，红色微动按钮、动态 Tooltip 和输入框上方等待横幅均按规范呈现并已通过自动化测试。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：在优雅打断等待期间，大模型当前文字输出正常完成，伴随发起的工具调用正常执行完毕并写盘落库，服务端不在当前回合结束后启动下一轮 LLM
      推理，会话平滑退出回到 Idle 状态。
    result: passed
    reason:
      text: 当前文字与伴随工具完整落库，SessionPrompt 核心循环在回合边界检测优雅打断标记安全 break 退出，不启动下轮推理，会话平滑恢复
        Idle。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：在优雅打断等待期间，输入框保持可编辑状态，允许用户提前输入文本草稿；当会话转为 Idle
      后，红色按钮自动恢复为常规发送箭头，输入框自动获得焦点，且 Assistant 消息正常展示完成耗时（不打红色 interrupted 标记）。
    result: passed
    reason:
      text: 优雅打断期间输入框保持可编辑，转为 Idle 后红钮恢复为发送图标，输入框自动获得焦点，Assistant 消息正常记录耗时且无
        interrupted 标记。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：在优雅打断等待期间，若用户再次点击红色停止按钮，界面弹出全局 ConfirmModal
      确认弹窗；用户点击“取消”时关闭弹窗并继续保持优雅打断等待状态。
    result: passed
    reason:
      text: 再次点击红钮唤起 ConfirmModal 确认弹窗；用户点击取消后弹窗关闭且继续保持优雅打断等待状态。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：在确认弹窗中用户点击“强制打断”时，系统立即调用底层强制打断，立即中断服务端 Fiber 并停止会话。
    result: passed
    reason:
      text: "确认弹窗中点击强制打断后以 { graceful: false } 调用服务端接口，立即中断 Fiber 并停止会话。"
      truncated: false
  - id: A6
    source: brief.md
    text: A6：在优雅打断触发时，若当前会话存在未决的 Question 提问或 Permission 权限审批，系统自动将其拒绝，避免会话卡在等待审批。
    result: passed
    reason:
      text: 优雅打断触发时，服务端与前端协同拒绝未决的 Question 与 Permission 待办项，并建立 closedSessions
        准入拦截，避免流程阻塞挂起。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：当优雅打断等待时长超过 30 秒时，横幅文本自动更新并高亮强调工具执行耗时较长，引导用户可通过红色按钮强制打断。
    result: passed
    reason:
      text: 优雅打断等待超过 30 秒时，横幅文本自动更新并高亮强化长耗时工具警示文案引导强停。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8：服务端 `POST /session/:sessionID/abort` 接受可选 `{ graceful: boolean }`
      请求体；在 `graceful: true` 时标记当前会话在当前回合结束后优雅退出，在缺省或 `false` 时执行立即强杀。"
    result: passed
    reason:
      text: "服务端 POST /session/:sessionID/abort 接口兼容 { graceful: true } 优雅打断与缺省/{
        graceful: false } 强制打断，自动化测试验证通过。"
      truncated: false
