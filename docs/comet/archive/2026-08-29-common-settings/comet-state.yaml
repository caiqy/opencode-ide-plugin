    source: brief.md
    text: A9：保存失败时不误报成功，关闭存在未保存修改的面板仍执行现有确认流程。
    result: passed
    reason:
      text: 保存异常进入错误状态，不显示成功；未保存关闭继续使用确认弹窗。
      truncated: false
  - id: A10
    source: specs/common-settings/spec.md
    text: 设置面板把“常用设置”作为标签栏第一项，打开设置时默认进入该页。页面只展示自动更新、文件快照、搜索模式、OpenAI
      搜索模型、网页搜索并行数、子任务并行数和错误重试上限，不展示现有常规页中的用户名、分享模式或工作目录。
    result: passed
    reason:
      text: 常用设置位于首项并展示全部目标字段，旧常规字段未展示。
      truncated: false
  - id: A11
    source: specs/common-settings/spec.md
    text: 每个配置项显示中文名称、可编辑控件和始终可见的详细说明。说明至少解释该配置控制的行为、未显式配置时的默认值，以及关闭或调整后最重要的影响。
    result: passed
    reason:
      text: 每个字段都有可编辑控件和可见中文说明。
      truncated: false
  - id: A12
    source: specs/common-settings/spec.md
    text: 页面通过现有全局配置读取和保存流程工作。所有本文所列默认值同时是字段缺失时的实际运行时默认值，界面不得显示与运行时不同的缺省状态。保存成功后以服务端返回配置刷新表单基线；保存失败时保留编辑内容并显示失败，不得误报成功。关闭未保存表单继续沿用现有确认行为。
    result: passed
    reason:
      text: 使用全局配置读写流程，成功后刷新表单基线，失败保留编辑内容。
      truncated: false
  - id: A13
    source: specs/common-settings/spec.md
    text: 数值输入为空、小数或越界时，页面保留用户输入，在对应字段下显示合法范围，并阻止保存；不得自动取整、截断到边界或恢复默认值。
    result: passed
    reason:
      text: 空值、小数和越界输入保留原值并显示字段错误，阻止保存。
      truncated: false
  - id: A14
    source: specs/common-settings/spec.md
    text: 自动更新使用布尔开关，未显式配置时默认开启。该开关只控制 IDE 插件的 GitHub Release
      定时检查及插件安装流程；关闭后插件不执行自动定时检查。OpenCode 后端自身的 `autoupdate` 配置不由此开关读取或修改。
    result: passed
    reason:
      text: IDE 插件自动更新独立使用宿主存储，默认开启，不读取后端 autoupdate。
      truncated: false
  - id: A15
    source: specs/common-settings/spec.md
    text: 文件快照使用布尔开关，未显式配置时默认关闭。关闭时，后续会话不记录文件状态快照，依赖快照的文件撤销或恢复能力不可用；开启后，后续会话恢复快照记录。
    result: passed
    reason:
      text: 文件快照界面与运行时均默认关闭，配置保存后影响后续会话。
      truncated: false
  - id: A16
    source: specs/common-settings/spec.md
    text: 搜索模式使用二选一控件，只提供“原生搜索”和“OpenAI 搜索”，未显式配置时默认选择“OpenAI 搜索”。“原生搜索”沿用现有
      Exa/Parallel 路径；“OpenAI 搜索”调用 OpenAI `/alpha/search` 路径。
    result: passed
    reason:
      text: 搜索模式为二选一，原生路径和 OpenAI alpha-search 路径映射正确。
      truncated: false
  - id: A17
    source: specs/common-settings/spec.md
    text: 选择 OpenAI 搜索时显示 OpenAI 搜索模型选择器，只列出可用于该路径的 OpenAI 模型。未显式配置时默认模型为
      `openai/gpt-5.6-luna`。所选模型未配置或没有可用凭据时，设置页阻止保存并显示明确提示，引导用户先完成 OpenAI
      配置；不得静默回退原生搜索。
    result: passed
    reason:
      text: OpenAI 模型选择器基于可用 provider 配置，模型或凭据不可用时显示错误并阻止保存。
      truncated: false
  - id: A18
    source: specs/common-settings/spec.md
    text: 用户从未保存过搜索设置时，运行时同样按默认值尝试 `openai/gpt-5.6-luna`。模型或凭据不可用时返回明确、可操作的配置错误，不执行
      Exa/Parallel 回退。
    result: passed
    reason:
      text: 未配置搜索时运行时默认尝试 openai/gpt-5.6-luna，失败不会回退原生搜索。
      truncated: false
  - id: A19
    source: specs/common-settings/spec.md
    text: 网页搜索并行数写入 `parallel_limit.websearch`，子任务并行数写入
      `parallel_limit.subagent`。两者均只接受 1–10 的整数，未显式配置时均为
      3。保存后的限制用于后续调用，正在执行的调用不受影响。
    result: passed
    reason:
      text: parallel_limit.websearch 和 subagent 均写入正确字段并被后续执行消费。
      truncated: false
  - id: A20
    source: specs/common-settings/spec.md
    text: 错误重试上限写入 `provider_retry.max_retries`，只接受 0–100 的整数，未显式配置时为
      10。该值表示首次请求失败后最多追加的自动重试次数；设置为 0 时禁用自动重试。保存后的限制用于后续模型请求，正在执行的请求不受影响。
    result: passed
    reason:
      text: provider_retry.max_retries 写入正确字段，0 禁用重试，后续请求使用保存值。
      truncated: false
  - id: A21
    source: specs/common-settings/spec.md
    text: S1：设置面板可进入“常用设置”，并展示全部目标配置项。
    result: passed
    reason:
      text: 设置面板可进入常用设置并展示完整目标配置。
      truncated: false
  - id: A22
    source: specs/common-settings/spec.md
    text: S2：每项均有始终可见的中文详细说明，覆盖用途、默认值和关键影响。
    result: passed
    reason:
      text: 配置说明均为始终可见的中文文案，覆盖默认值和影响。
      truncated: false
  - id: A23
    source: specs/common-settings/spec.md
    text: S3：表单缺省状态与最终确认的实际运行时默认行为一致。
    result: passed
    reason:
      text: 界面默认状态与运行时默认值一致。
      truncated: false
  - id: A24
    source: specs/common-settings/spec.md
    text: S4：数值项只接受各自范围内的整数；无效输入保留原值、显示行内提示并阻止保存，合法值可保存并被后续执行消费。
    result: passed
    reason:
      text: 数值校验、错误显示、保存阻止和合法值保存逻辑完整。
      truncated: false
  - id: A25
    source: specs/common-settings/spec.md
    text: S5：保存失败和未保存关闭继续遵守现有错误及确认行为。
    result: passed
    reason:
      text: 保存失败和未保存关闭行为符合现有错误及确认流程。
      truncated: false
  - id: A26
    source: specs/common-settings/spec.md
    text: S6：默认 OpenAI 模型不可用时，设置页阻止保存，运行时返回明确配置错误，二者均不回退原生搜索。
    result: passed
    reason:
      text: 默认 OpenAI 模型不可用时界面阻止保存，运行时返回明确错误且不回退原生搜索。
      truncated: false
