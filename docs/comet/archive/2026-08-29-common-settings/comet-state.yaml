  - id: A8
    source: brief.md
    text: A8：错误重试上限接受 0–100 的整数，未显式配置时为 10；0 禁用错误重试，保存值限制后续模型请求的自动重试次数。
    result: passed
    reason:
      text: 重试上限默认 10，校验范围为 0–100，运行时消费配置。
