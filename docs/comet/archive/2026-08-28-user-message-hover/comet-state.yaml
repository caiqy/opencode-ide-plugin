acceptance:
  - id: A1
    source: brief.md
    text: "A1: 主会话支持 hover 的设备上，鼠标移入用户消息后，时间和五个操作图标显示在气泡下方，而不是气泡上方。"
    result: passed
    reason:
      text: 主会话用户元信息在消息气泡下方按 hover 显示。
      truncated: false
  - id: A2
    source: brief.md
    text: "A2: 主会话元信息行右对齐，顺序为本地时间、复制、分叉、回退、重试，且不使用外层灰色工具栏背景。"
    result: passed
    reason:
      text: 右对齐且顺序为时间、复制、分叉、回退、重试，无灰色工具栏。
      truncated: false
  - id: A3
    source: brief.md
    text: "A3: 时间取用户消息的 `time.created`，使用浏览器本地时区并按 `M月D日 HH:mm` 格式显示。"
    result: passed
    reason:
      text: 使用 time.created、本地时区和 M月D日 HH:mm。
      truncated: false
  - id: A4
    source: brief.md
    text: "A4: 复制、分叉、回退按钮及其 tooltip 继续执行现有功能，操作逻辑不变。"
    result: passed
    reason:
      text: 复制、分叉、回退的既有功能和 tooltip 保持。
      truncated: false
  - id: A5
    source: brief.md
    text: "A5: 主会话所有用户消息都显示重试按钮；点击后先打开确认弹窗，确认后才将该消息的原文本和附件作为新的 prompt 追加到当前会话末尾。"
    result: passed
    reason:
      text: 重试先确认，确认后发送原文本和附件。
      truncated: false
  - id: A6
    source: brief.md
    text: "A6: 对话未停止时重试按钮保留但禁用；对话停止后可点击重试。"
    result: passed
    reason:
      text: 运行中重试显示但禁用，停止后可用。
      truncated: false
  - id: A7
    source: brief.md
    text: "A7: 重试确认弹窗支持确认、取消和关闭；取消或关闭不得发送新的 prompt，确认期间显示加载状态并阻止重复确认。"
    result: passed
    reason:
      text: 取消、关闭和 Escape 不发送，确认期间 loading 且防重复。
      truncated: false
  - id: A8
    source: brief.md
    text: "A8: assistant 消息 hover 时不再显示任何操作控件，包括复制和令牌用量控件。"
    result: passed
    reason:
      text: assistant 不显示操作控件。
      truncated: false
  - id: A9
    source: brief.md
    text: "A9: 主会话无 hover 的触摸设备上，用户消息时间和五个操作图标可见且可访问；键盘 focus 时元信息可见。"
    result: passed
    reason:
      text: 打包验证确认触摸、键盘 focus 和操作可访问性。
      truncated: false
  - id: A10
    source: brief.md
    text: "A10: 主会话用户消息元信息处于正常文档流，不遮挡文本或附件；窄屏下可换行且图标点击区域不收缩。"
    result: passed
    reason:
      text: 元信息处于正常流，窄屏可换行且按钮不收缩。
      truncated: false
  - id: A11
    source: brief.md
    text: "A11: 子任务抽屉用户消息在气泡下方显示本地时间和复制按钮，不显示分叉、回退或重试按钮。"
    result: passed
    reason:
      text: 子任务只显示时间和复制。
      truncated: false
  - id: A12
    source: brief.md
    text: "A12: 子任务抽屉用户消息复制按钮继续可用，并遵循支持 hover、键盘 focus 和触摸设备的可访问显示规则。"
    result: passed
    reason:
      text: 子任务复制支持 hover、focus 和触摸显示规则。
      truncated: false
  - id: A13
    source: specs/user-message-hover/spec.md
    text: WebGUI
      主会话用户消息在用户可查看或操作消息时，必须在消息气泡下方提供时间、复制、分叉、回退和重试入口。子任务抽屉用户消息在气泡下方提供时间和复制入口。assistant
      消息 hover 时不得显示操作控件。
    result: passed
    reason:
      text: 主会话、子任务和 assistant 功能边界符合规格。
      truncated: false
  - id: A14
    source: specs/user-message-hover/spec.md
    text: 主会话用户消息的元信息必须位于对应消息气泡下方，并与气泡右侧对齐。元信息从左到右依次显示消息时间、复制按钮、分叉按钮、回退按钮和重试按钮。子任务抽屉用户消息的元信息必须位于气泡下方并右对齐，只显示消息时间和复制按钮。操作区域不得绝对定位在消息气泡上方，也不得使用包裹全部按钮的灰色工具栏背景。
    result: passed
    reason:
      text: 打包验证确认气泡下方布局、对齐和窄屏几何。
      truncated: false
  - id: A15
    source: specs/user-message-hover/spec.md
    text: 主会话和子任务抽屉的元信息行必须处于正常文档流，不得遮挡用户消息文本或附件。消息气泡内容、换行、附件和现有右侧消息布局必须保持不变。窄屏下元信息允许换行，操作容器和图标按钮不得收缩到不可用尺寸。
    result: passed
    reason:
      text: 元信息在正常文档流且不遮挡内容或附件。
      truncated: false
  - id: A16
    source: specs/user-message-hover/spec.md
    text: 在支持 hover 的设备上，用户将鼠标移入对应用户消息时显示元信息；鼠标移出后隐藏。元信息获得键盘 focus 时必须显示，以便 Tab
      用户看到当前操作。元信息中的单个图标按钮必须提供 tooltip、可访问名称和稳定点击区域。
    result: passed
    reason:
      text: hover、focus-within、tooltip、可访问名称和点击区域均符合。
      truncated: false
  - id: A17
    source: specs/user-message-hover/spec.md
    text: 在不支持 hover 的触摸设备上，主会话元信息必须常驻显示，使五个用户消息操作无需 hover 即可访问；子任务抽屉元信息必须常驻显示，使复制无需
      hover 即可访问。
    result: passed
    reason:
      text: hover:none 下元信息常驻。
      truncated: false
  - id: A18
    source: specs/user-message-hover/spec.md
    text: assistant 消息 hover 时不得显示复制、令牌用量或其他操作控件。
    result: passed
    reason:
      text: assistant 无复制、令牌用量或其他 hover 控件。
      truncated: false
  - id: A19
    source: specs/user-message-hover/spec.md
    text: 子任务抽屉用户消息不得显示分叉、回退或重试按钮。
    result: passed
    reason:
      text: 子任务无分叉、回退或重试。
      truncated: false
  - id: A20
    source: specs/user-message-hover/spec.md
    text: 时间必须使用用户消息 `time.created`。显示时使用浏览器本地时区和 `M月D日 HH:mm` 格式，例如 `8月20日
      21:08`。时间只属于用户消息元信息行，不得修改消息时间或其他消息排序逻辑。
    result: passed
    reason:
      text: 时间使用用户消息 time.created，不改变排序。
      truncated: false
  - id: A21
    source: specs/user-message-hover/spec.md
    text: 复制、分叉和回退按钮必须保留现有图标、tooltip、点击行为、确认流程、忙碌状态和副作用。三个操作的相对顺序不得改变。
    result: passed
    reason:
      text: 复制、分叉、回退的顺序和既有副作用保持。
      truncated: false
  - id: A22
    source: specs/user-message-hover/spec.md
    text: 每条主会话用户消息都必须显示重试按钮，且重试位于回退按钮之后。点击重试首先打开确认弹窗，不得立即发送；用户确认后，才将该用户消息的原文本和附件作为新的
      prompt 追加到当前会话末尾，复用现有会话 prompt
      发送流程，不修改原消息或历史排序。用户取消或关闭弹窗不得发送。子任务抽屉用户消息不提供重试。
    result: passed
    reason:
      text: 主会话重试先确认后发送，子任务不提供重试。
      truncated: false
  - id: A23
    source: specs/user-message-hover/spec.md
    text: 当当前会话未停止时，重试按钮必须保持显示但处于禁用状态，不得打开确认弹窗或触发新的发送；会话停止后按钮恢复可用。确认弹窗在发送期间必须显示加载状态并阻止重复确认。重试按钮和确认弹窗必须提供清晰的可访问名称和
      tooltip。
    result: passed
    reason:
      text: 运行中禁用、确认 loading、防重复和可访问名称均符合。
      truncated: false
  - id: A24
    source: specs/user-message-hover/spec.md
    text: 用户消息的复制、分叉和回退逻辑、确认流程、忙碌状态和副作用保持不变。此能力不新增编辑操作，不改变服务端协议、消息数据结构或已有会话撤销流程。
    result: passed
    reason:
      text: 未改变协议、消息结构或撤销流程。
      truncated: false
