acceptance:
  - id: A1
    source: brief.md
    text: A1：同一后端进程内、其他目录创建的会话在后台执行时，WebGUI 打开的会话界面无需刷新即可实时显示流式消息，并在执行完成后自动结束“生成中”。
    result: passed
    reason:
      text: /global/event 信封正确解包并分发；跨目录消息增量与 session.idle 会更新 store 和空闲状态。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：在该跨目录会话后台执行期间切走到其他会话、再切回时，界面显示已产生的后台内容，不再残留“生成中”，Composer 可以继续输入。
    result: passed
    reason:
      text: 后台会话事件按 sessionID 保留在消息 store，状态事件按任意 session 更新，切回后可见内容且解除 busy。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：在当前目录点击“+”，只复用当前目录内的空会话；其他目录的空会话不会被选中或切换。
    result: passed
    reason:
      text: 空默认会话筛选与草稿复用均要求归一化后的当前目录匹配。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：当恢复的草稿指针指向其他目录的会话时，新建流程不复用该会话，而是在当前目录创建或复用会话。
    result: passed
    reason:
      text: 草稿会话目录不匹配时判为不可复用，并转入当前目录限定的 fallback/创建流程。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：运行 VS Code 插件自动化测试后，用户真实数据目录不产生测试遗留会话（测试数据写入隔离的临时目录）。
    result: passed
    reason:
      text: VS Code 测试配置向临时目录注入全部 XDG_* 环境变量；后端继承宿主环境，核心路径使用这些变量。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：当消息缓存中只有缺少 `model`/`agent` 的乐观用户消息时，切换或恢复该会话不抛异常，Composer
      不会停留在“正在切换会话设置…”。
    result: passed
    reason:
      text: selection 恢复跳过缺少 model/agent 的乐观消息；仅有不完整消息时安全返回 null。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：会话设置恢复过程发生任意异常时，Composer 自动解除禁用并可继续输入，不会永久锁死。
    result: passed
    reason:
      text: 激活流程捕获恢复异常、记录错误并调用 resolveSelections 收敛 pending 状态。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：WebGUI 与 VS Code 插件的新增与既有自动化测试通过；会话列表跨目录可见、消息提交、停止生成等既有行为不回归。
    result: passed
    reason:
      text: 当前实现保留跨目录列表和既有提交/停止路径；webgui-tests、webgui-typecheck、vscode-tests 均已通过。
      truncated: false
