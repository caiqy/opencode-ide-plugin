acceptance:
  - id: A1
    source: brief.md
    text: "Scenario: A1 新增「运行和调试」大类且默认全量禁用 - GIVEN WebGUI 连接 VS Code
      宿主且项目未配置过「运行和调试」大类 - WHEN 用户打开 ACP 状态面板，或 AI 会话初始化 - THEN 「运行和调试」大类展示为 0/N
      启用 - AND 模型工具清单不包含任何未开启的调试工具"
    result: passed
    reason:
      text: debug 大类及 13 个子工具已上报；WebGUI 未配置时大类和工具均为 false，matchAcpTools 仅注册
        acp.platform_vscode 下显式开启的工具。
      truncated: false
  - id: A2
    source: brief.md
    text: "Scenario: A2 配置枚举与启动 / 停止调试 - GIVEN 已开启配置与启停类子工具，工作区存在
      `.vscode/launch.json` 静态配置 - WHEN 模型调用列出配置并以名称启动，或停止当前调试会话 - THEN
      返回静态配置列表，且对存在的名称真实发起 / 停止调试会话 - AND 名称不存在或无活动会话时返回明确错误"
    result: passed
    reason:
      text: 静态 launch 配置枚举、按名称启动、停止及重启均已接入 VS Code API；启动失败、参数错误和无活动会话均返回明确错误。
      truncated: false
  - id: A3
    source: brief.md
    text: "Scenario: A3 暂停时读取状态、调用堆栈与变量 - GIVEN 已开启状态读取类子工具，调试会话在断点处暂停 - WHEN
      模型查询调试状态、调用堆栈与变量 - THEN 返回活动会话、暂停原因与线程、栈帧列表及变量值（支持嵌套展开）"
    result: passed
    reason:
      text: 暂停门禁、状态/线程/调用栈/嵌套变量链路完整；无 threadId 全局暂停后的 continued(false) 会从 threads 响应或
        thread 事件物化其余线程并保持可读。
      truncated: false
  - id: A4
    source: brief.md
    text: "Scenario: A4 断点管理与执行控制 - GIVEN 已开启断点与执行控制子工具 - WHEN 模型添加 /
      删除源断点（可含条件），或执行继续、单步、暂停 - THEN VS Code 断点列表相应更新，执行控制透传至活动会话 - AND
      无活动会话时返回明确错误"
    result: passed
    reason:
      text: 断点增删和 continue/step/pause 均已透传；标准 InitializeResponse.body 能力形状下，单线程 step
        只失效目标线程；控制成功后 threads 查询失败仍返回成功并保守清空缓存。
      truncated: false
  - id: A5
    source: brief.md
    text: "Scenario: A5 表达式求值与异常断点 - GIVEN 已开启求值与异常断点子工具，调试会话处于暂停 - WHEN
      模型在指定栈帧求值表达式，或设置异常断点过滤器 - THEN 返回求值结果，异常断点按调试适配器能力透传 - AND 适配器不支持时返回明确错误"
    result: passed
    reason:
      text: evaluate 受暂停状态门禁并返回结果；异常断点请求直接透传，适配器拒绝会作为明确错误传播。
      truncated: false
  - id: A6
    source: brief.md
    text: "Scenario: A6 安全降级与既有功能不回归 - GIVEN 宿主未连接、无活动会话或 `vscode.debug` 不可用 - WHEN
      调用调试工具或查看 ACP 面板 - THEN 返回明确错误 / 未连接提示，不影响 WebGUI 运行 - AND 其它 ACP 大类与 MCP
      功能行为保持不变"
    result: passed
    reason:
      text: 无会话、未暂停和 vscode.debug 不可用均有明确错误；状态查询的 threads 失败会降级为空列表；既有授权、ACP 与 MCP
        链路未被改写。
      truncated: false
