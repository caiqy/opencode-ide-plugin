acceptance:
  - id: A1
    source: brief.md
    text: A1：普通对话、配置 model 的 native/alpha search 和 task/subagent 在任何可见输出前收到 HTTP 429
      时会自动重试，成功后只产生一份最终回答或搜索结果。
    result: passed
    reason:
      text: legacy Session、V2 RequestExecutor、V1/V2 model-backed native/alpha search
        均在可见输出前处理 HTTP 429；task/subagent 复用子 Session 机制，成功路径只保留一份最终结果。
      truncated: false
  - id: A2
    source: brief.md
    text: A2：所有新增 HTTP 429 路径每次至少等待 10 秒；严格合法的 Retry-After 要求更久时等待更久，缺失、无效或短于 10
      秒时等待 10 秒，不再使用指数退避或累计等待上限。
    result: passed
    reason:
      text: 新增 429 路径统一使用 max(10000ms, 合法 Retry-After)，没有指数退避或累计等待上限；legacy 不再截断超过
        2^31-1ms 的合法值。
      truncated: false
  - id: A3
    source: brief.md
    text: A3：`provider_retry.max_retries` 以非负整数配置每个 provider turn 或 model-backed
      search invocation 在初始请求外的最大重试次数；未配置默认 5，配置 0 关闭，SDK、executor 和 route
      fallback 不会各自重置次数。
    result: passed
    reason:
      text: provider_retry.max_retries 为非负整数，默认 5、0 禁用；各路径各自只有一个预算 owner，search 只对
        HTTP 429 增加 retry 计数。
      truncated: false
  - id: A4
    source: brief.md
    text: A4：用户取消、父 task 取消或 Session 删除会中断当前等待并阻止后续 provider 请求。
    result: passed
    reason:
      text: 等待均可中断；Session.remove 动态读取 SessionExecution.Service，依次中断
        root、child、grandchild，V1 同时取消前台执行。
      truncated: false
  - id: A5
    source: brief.md
    text: A5：明确的 quota exceeded、认证、权限和其他 typed permanent failure 直接失败；既有
      provider-specific 非 429 分类不因本 change 改变。
    result: passed
    reason:
      text: typed permanent failure 均为 terminal；legacy 已识别
        error.type=insufficient_quota，即使 SDK 标记 isRetryable=true 也不会重试。
      truncated: false
  - id: A6
    source: brief.md
    text: A6：provider 已产生 text、reasoning、hosted/local tool 事件后再失败时不会重试整轮。
    result: passed
    reason:
      text: legacy 可见输出 gate 与 V2 流边界均阻止部分输出后的整轮重放。
      truncated: false
  - id: A7
    source: brief.md
    text: A7：model-backed search 的 fallback 共用预算，最终错误保留脱敏后的 HTTP 状态、Retry-After 与
      rate-limit/quota 分类；普通 MCP websearch 不增加重试。
    result: passed
    reason:
      text: V1/V2 model-backed search 共享 invocation 级 429 预算，最终错误只投影脱敏状态、Retry-After
        与分类；MCP 路径未增加 loop。
      truncated: false
  - id: A8
    source: brief.md
    text: A8：task/subagent 不建立额外 retry loop，仅由其子 Session 的 provider turn 使用上述预算。
    result: passed
    reason:
      text: task 工具没有额外 retry loop，provider 重试仅由 child Session owner 负责。
      truncated: false
  - id: A9
    source: specs/provider-retry/spec.md
    text: 普通对话、配置 model 的 provider native/alpha search 与 task/subagent 子 Session 必须在
      provider 尚未产生任何可见内容或 tool 事件时，对 HTTP 429 rate limit 自动重试。没有 HTTP 429 状态的流内
      provider-error 不属于本能力，沿用既有处理。
    result: passed
    reason:
      text: 能力限定于无可见输出的 HTTP 429；无 HTTP 429 的流内错误沿用既有行为。
      truncated: false
  - id: A10
    source: specs/provider-retry/spec.md
    text: "`provider_retry.max_retries` 使用非负整数配置每个 provider turn 或 model-backed
      search invocation 在初始请求之外的最大重试次数。未配置时默认 5，配置 0 时关闭新增的 HTTP 429
      自动重试。每次重试至少等待 10 秒；严格合法的 `retry-after-ms`、`Retry-After` 十进制秒数或未来 HTTP-date
      要求更久时等待更久，负数、混合字符串、过期日期及其他非法值视为缺失。不使用指数退避、jitter 或累计等待上限。"
    result: passed
    reason:
      text: 三类合法 Retry-After 均严格解析，非法值回退 10 秒；默认、0、10 次和耗尽行为已有覆盖。
      truncated: false
  - id: A11
    source: specs/provider-retry/spec.md
    text: 明确的 quota exceeded、认证、权限和 typed permanent failure 不得因 HTTP 状态文本被重新分类为
      retryable。既有 provider-specific 非 429 规则保持兼容，本能力不重新定义 OpenAI 404 等历史行为。
    result: passed
    reason:
      text: 永久分类优先于 status/message retry 判定；既有非 429 provider 规则保持原分支。
      truncated: false
  - id: A12
    source: specs/provider-retry/spec.md
    text: 一旦本轮产生 text、reasoning、tool input、tool call、tool result 或其他可见 provider
      事件，后续任何错误都直接结束本轮，不得清空、追加或重放。用户取消、父 task 取消或 Session 删除必须中断 retry
      wait，并保证取消后不再调用 provider。
    result: passed
    reason:
      text: 部分输出后 retry 被禁止；用户取消、父 task 取消及 Session 删除均中断等待并阻止下一次请求。
      truncated: false
  - id: A13
    source: specs/provider-retry/spec.md
    text: 预算 owner 必须唯一，并使用合并后的同一个 `provider_retry.max_retries` 值。legacy Session
      orchestration 关闭 AI SDK/native executor 内层预算并继续发布现有 retry 状态；V2 普通
      provider turn 由 typed RequestExecutor 拥有预算且不新增 V2 状态协议；V1/V2 model-backed
      search 由一次 tool invocation 拥有预算并关闭内部 SDK/executor 重试。task/subagent 不增加
      task 级 retry loop。
    result: passed
    reason:
      text: legacy、V2 turn、V1/V2 search 均有唯一预算 owner，task 不增加预算层。
      truncated: false
  - id: A14
    source: specs/provider-retry/spec.md
    text: 配置 model 的 native 与 alpha search fallback 必须共享最多 `max_retries + 1`
      个总请求。最终失败只暴露脱敏后的 HTTP 状态、Retry-After 和 rate-limit/quota 分类，并只产生一个最终 tool
      result。未配置 model 的 Exa/Parallel MCP websearch 保持现状，不增加重试。
    result: passed
    reason:
      text: native/alpha fallback 共享 429 计数，非 429 fallback 保持原行为；alpha quota 保留脱敏 HTTP
        429、retry-after-ms 和 QuotaExceeded。
      truncated: false
  - id: A15
    source: specs/provider-retry/spec.md
    text: 实现必须将 `provider_retry.max_retries` 加入 V1/V2 Config schema 和生成的 JSON
      Schema，不得增加第三方依赖或第二个 V2 provider-turn 调用点。`@opencode-ai/llm` 的 V2 Session
      runner 继续每 turn 只显式调用一次 `llm.stream(request)`。
    result: passed
    reason:
      text: V1/V2 Config、OpenAPI 与 SDK 均含配置；无新增依赖，V2 runner 保持单一 llm.stream(request)
        调用。
      truncated: false
  - id: A16
    source: specs/provider-retry/spec.md
    text: 验收使用确定性 fake provider/HTTP 响应覆盖 429 后成功、合法和非法 Retry-After、10 秒最短等待、默认/0/10
      次配置、次数耗尽、quota/permanent failure、取消、Session 删除、fallback 共用次数、部分输出后不重试，以及
      task 子 Session 不增加第二层预算。真实上游调用不作为验收前提。
    result: passed
    reason:
      text: 确定性测试覆盖规格列出的重试、等待、次数、永久错误、取消、删除、fallback、部分输出与 task 边界；Runtime 检查全部通过。
      truncated: false
