name: Release

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            hosts/vscode-plugin/pnpm-lock.yaml

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            if [[ "${GITHUB_REF#refs/tags/}" == *"-"* ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi
          # version without leading 'v' for use as OPENCODE_VERSION
          VER="$(grep -oP '"version":\s*"\K[^"]+' packages/opencode/package.json)"
          echo "version_number=$VER" >> $GITHUB_OUTPUT

      - name: Inject version into plugin manifests
        run: |
          # Strip leading 'v' prefix if present (e.g. v1.2.3 -> 1.2.3)
          RAW_VERSION="${{ steps.version.outputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "Injecting version: $CLEAN_VERSION"

          # VS Code requires semver (3 segments: major.minor.patch).
          # Convert 4-segment CalVer YYYY.M.D.B to YYYY.MDD.B
          # e.g. 2026.2.6.4 -> 2026.206.4
          VSCODE_VERSION=$(node -e '
            const v = process.argv[1];
            const parts = v.split(".");
            if (parts.length === 4) {
              const [year, month, day, build] = parts;
              console.log(year + "." + (parseInt(month) * 100 + parseInt(day)) + "." + build);
            } else {
              console.log(v);
            }
          ' "$CLEAN_VERSION")
          echo "VSCode version: $VSCODE_VERSION"

          # Update VSCode plugin package.json
          node -e '
            const fs = require("fs");
            const path = "hosts/vscode-plugin/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("Updated " + path + " to version " + process.argv[1]);
          ' "$VSCODE_VERSION"

          # Update JetBrains plugin build.gradle.kts fallback version
          sed -i "s/^version = findProperty(\"plugin.version\")?.toString() ?: \".*\"/version = findProperty(\"plugin.version\")?.toString() ?: \"$CLEAN_VERSION\"/" hosts/jetbrains-plugin/build.gradle.kts
          echo "Updated hosts/jetbrains-plugin/build.gradle.kts to version $CLEAN_VERSION"

      - name: Build backend binaries
        run: ./hosts/scripts/build_opencode.sh
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version_number }}

      - name: Install VSCode plugin dependencies (all)
        working-directory: hosts/vscode-plugin
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Compile VSCode plugin TypeScript
        working-directory: hosts/vscode-plugin
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run compile:production
          else
            npm run compile:production
          fi

      - name: Package VSCode plugin (standard) from staging
        working-directory: hosts/vscode-plugin
        run: |
          STAGE_DIR="../tmp_opencode_vscode_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          # Copy minimal required files
          cp package.json "$STAGE_DIR/"
          cp -R out "$STAGE_DIR/out"
          cp -R resources "$STAGE_DIR/resources"
          [ -f README.md ] && cp README.md "$STAGE_DIR/" || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "$STAGE_DIR/" || true
          [ -f ../../LICENSE ] && cp ../../LICENSE "$STAGE_DIR/" || true

          # Sanitize package.json: remove scripts and devDependencies
          node -e '
            const fs=require("fs");
            const path=require("path");
            const pkgPath=path.resolve(process.cwd(), "../tmp_opencode_vscode_stage/package.json");
            const pkg=JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            delete pkg.scripts;
            delete pkg.devDependencies;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          '

          # Package from staging directory without touching dependencies
          ( cd "$STAGE_DIR" && npx -y @vscode/vsce package --no-dependencies --out "opencode-standard.vsix" )

          # Move artifact back into plugin dir for later collection
          mv "$STAGE_DIR"/*.vsix .

          # Clean up staging
          rm -rf "$STAGE_DIR"

      - name: Build JetBrains plugin distribution (standard)
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 8.7
          arguments: buildPlugin
          build-root-directory: hosts/jetbrains-plugin

      - name: Prepare release artifacts
        run: |
          mkdir -p release-artifacts

          # Copy and rename VSCode standard extension
          if [ -f hosts/vscode-plugin/opencode-standard.vsix ]; then
            cp hosts/vscode-plugin/opencode-standard.vsix \
              "release-artifacts/opencode-vscode-${{ steps.version.outputs.version }}.vsix"
          fi

          # Copy and rename JetBrains plugin
          zipfile=$(find hosts/jetbrains-plugin/build/distributions -name "*.zip" -type f | head -n1)
          if [ -n "$zipfile" ]; then
            cp "$zipfile" "release-artifacts/opencode-jetbrains-${{ steps.version.outputs.version }}.zip"
          fi

          ls -la

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: OpenCode Release ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## OpenCode Release ${{ steps.version.outputs.version }}

            This release includes:
            - **VSCode Extension (standard)**: `opencode-vscode-${{ steps.version.outputs.version }}.vsix` — bundles opencode binaries
            - **JetBrains Plugin (standard)**: `opencode-jetbrains-${{ steps.version.outputs.version }}.zip` — bundles opencode binaries

            ### Installation Instructions

            #### VSCode Extension (standard — includes binaries)
            1. Download `opencode-vscode-${{ steps.version.outputs.version }}.vsix`
            2. Install using: `code --install-extension opencode-vscode-${{ steps.version.outputs.version }}.vsix`

            #### JetBrains Plugin (standard — includes binaries)
            1. Download `opencode-jetbrains-${{ steps.version.outputs.version }}.zip`
            2. In your JetBrains IDE, go to Settings → Plugins → Install Plugin from Disk
            3. Select the downloaded zip file

            ### What's Changed
            See the auto-generated release notes below for detailed changes.

  test-artifacts:
    runs-on: ubuntu-latest
    needs: build-release
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-artifacts
          path: ./test-artifacts
        continue-on-error: true

      - name: Verify artifacts
        run: |
          echo "Checking release artifacts..."
          ls -la ./test-artifacts/ || echo "No artifacts found"

          # Check if VSCode standard extension exists
          if ls ./test-artifacts/opencode-vscode-v*.vsix 1> /dev/null 2>&1; then
            echo "✓ VSCode extension (standard) found"
          else
            echo "✗ VSCode extension (standard) missing"
          fi

          # Check if JetBrains standard plugin exists
          if ls ./test-artifacts/opencode-jetbrains-*.zip 1> /dev/null 2>&1; then
            echo "✓ JetBrains plugin (standard) found"
          else
            echo "✗ JetBrains plugin (standard) missing"
          fi
