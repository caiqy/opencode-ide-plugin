name: Release

on:
  # push:
  #   tags:
  #     - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  # ── Stage 1: build backend binaries (shared by both plugins) ──
  build-backend:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      clean_version: ${{ steps.version.outputs.clean_version }}
      vscode_version: ${{ steps.version.outputs.vscode_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            if [[ "${GITHUB_REF#refs/tags/}" == *"-"* ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi
          VER="$(grep -oP '"version":\s*"\K[^"]+' packages/opencode/package.json)"
          echo "version_number=$VER" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${RAW_VERSION#v}"
          echo "clean_version=$CLEAN_VERSION" >> $GITHUB_OUTPUT

          VSCODE_VERSION=$(node -e '
            const v = process.argv[1];
            const parts = v.split(".");
            if (parts.length === 4) {
              const [year, month, day, build] = parts;
              console.log(year + "." + (parseInt(month) * 100 + parseInt(day)) + "." + build);
            } else {
              console.log(v);
            }
          ' "$CLEAN_VERSION")
          echo "vscode_version=$VSCODE_VERSION" >> $GITHUB_OUTPUT

      - name: Build backend binaries
        run: ./hosts/scripts/build_opencode.sh --exclude-os=linux
        env:
          OPENCODE_VERSION: ${{ steps.version.outputs.version_number }}

      - name: Upload VSCode binaries
        uses: actions/upload-artifact@v4
        with:
          name: vscode-bin
          path: hosts/vscode-plugin/resources/bin
          retention-days: 1

      - name: Upload JetBrains binaries
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-bin
          path: hosts/jetbrains-plugin/src/main/resources/bin
          retention-days: 1

  # ── Stage 2a: build VSCode extension (parallel) ──
  build-vscode:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            hosts/vscode-plugin/pnpm-lock.yaml
            hosts/vscode-plugin/package.json

      - name: Download backend binaries
        uses: actions/download-artifact@v4
        with:
          name: vscode-bin
          path: hosts/vscode-plugin/resources/bin

      - name: Inject VSCode version
        run: |
          node -e '
            const fs = require("fs");
            const path = "hosts/vscode-plugin/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("Updated " + path + " to version " + process.argv[1]);
          ' "${{ needs.build-backend.outputs.vscode_version }}"

      - name: Install dependencies
        working-directory: hosts/vscode-plugin
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Compile TypeScript
        working-directory: hosts/vscode-plugin
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run compile:production
          else
            npm run compile:production
          fi

      - name: Package VSCode plugin from staging
        working-directory: hosts/vscode-plugin
        run: |
          STAGE_DIR="../tmp_opencode_vscode_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          cp package.json "$STAGE_DIR/"
          cp -R out "$STAGE_DIR/out"
          cp -R resources "$STAGE_DIR/resources"
          [ -f README.md ] && cp README.md "$STAGE_DIR/" || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "$STAGE_DIR/" || true
          [ -f ../../LICENSE ] && cp ../../LICENSE "$STAGE_DIR/" || true

          node -e '
            const fs=require("fs");
            const path=require("path");
            const pkgPath=path.resolve(process.cwd(), "../tmp_opencode_vscode_stage/package.json");
            const pkg=JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            delete pkg.scripts;
            delete pkg.devDependencies;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          '

          ( cd "$STAGE_DIR" && npx -y @vscode/vsce package --no-dependencies --out "opencode-standard.vsix" )
          mv "$STAGE_DIR"/*.vsix .
          rm -rf "$STAGE_DIR"

      - name: Upload VSCode artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-plugin
          path: hosts/vscode-plugin/opencode-standard.vsix
          retention-days: 1

  # ── Stage 2b: build JetBrains plugin (parallel) ──
  build-jetbrains:
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Download backend binaries
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-bin
          path: hosts/jetbrains-plugin/src/main/resources/bin

      - name: Inject JetBrains version
        run: |
          CLEAN_VERSION="${{ needs.build-backend.outputs.clean_version }}"
          sed -i "s/^version = findProperty(\"plugin.version\")?.toString() ?: \".*\"/version = findProperty(\"plugin.version\")?.toString() ?: \"$CLEAN_VERSION\"/" hosts/jetbrains-plugin/build.gradle.kts
          echo "Updated hosts/jetbrains-plugin/build.gradle.kts to version $CLEAN_VERSION"

      - name: Build JetBrains plugin
        working-directory: hosts/jetbrains-plugin
        run: gradle buildPlugin

      - name: Upload JetBrains artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-plugin
          path: hosts/jetbrains-plugin/build/distributions/*.zip
          retention-days: 1

  # ── Stage 3: create GitHub release ──
  create-release:
    runs-on: ubuntu-latest
    needs: [build-backend, build-vscode, build-jetbrains]
    permissions:
      contents: write
    steps:
      - name: Download VSCode artifact
        uses: actions/download-artifact@v4
        with:
          name: vscode-plugin
          path: ./artifacts

      - name: Download JetBrains artifact
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-plugin
          path: ./artifacts

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.build-backend.outputs.version }}"
          mkdir -p release-artifacts

          if [ -f artifacts/opencode-standard.vsix ]; then
            cp artifacts/opencode-standard.vsix "release-artifacts/opencode-vscode-${VERSION}.vsix"
          fi

          zipfile=$(find artifacts -name "*.zip" -type f | head -n1)
          if [ -n "$zipfile" ]; then
            cp "$zipfile" "release-artifacts/opencode-jetbrains-${VERSION}.zip"
          fi

          ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.build-backend.outputs.version }}
          name: OpenCode Release ${{ needs.build-backend.outputs.version }}
          prerelease: ${{ needs.build-backend.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## OpenCode Release ${{ needs.build-backend.outputs.version }}

            This release includes:
            - **VSCode Extension (standard)**: `opencode-vscode-${{ needs.build-backend.outputs.version }}.vsix` — bundles opencode binaries
            - **JetBrains Plugin (standard)**: `opencode-jetbrains-${{ needs.build-backend.outputs.version }}.zip` — bundles opencode binaries

            ### Installation Instructions

            #### VSCode Extension (standard — includes binaries)
            1. Download `opencode-vscode-${{ needs.build-backend.outputs.version }}.vsix`
            2. Install using: `code --install-extension opencode-vscode-${{ needs.build-backend.outputs.version }}.vsix`

            #### JetBrains Plugin (standard — includes binaries)
            1. Download `opencode-jetbrains-${{ needs.build-backend.outputs.version }}.zip`
            2. In your JetBrains IDE, go to Settings → Plugins → Install Plugin from Disk
            3. Select the downloaded zip file

            ### What's Changed
            See the auto-generated release notes below for detailed changes.

  test-artifacts:
    runs-on: ubuntu-latest
    needs: create-release
    if: always()

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: vscode-plugin
          path: ./test-artifacts
        continue-on-error: true

      - name: Download JetBrains artifacts
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-plugin
          path: ./test-artifacts
        continue-on-error: true

      - name: Verify artifacts
        run: |
          echo "Checking release artifacts..."
          ls -la ./test-artifacts/ || echo "No artifacts found"

          if ls ./test-artifacts/*.vsix 1> /dev/null 2>&1; then
            echo "✓ VSCode extension (standard) found"
          else
            echo "✗ VSCode extension (standard) missing"
          fi

          if ls ./test-artifacts/*.zip 1> /dev/null 2>&1; then
            echo "✓ JetBrains plugin (standard) found"
          else
            echo "✗ JetBrains plugin (standard) missing"
          fi
