name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g., v1.0.0)"
        required: true
        type: string
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

jobs:
  # ---------------------------------------------------------------------------
  # 1.  Pre-flight: replay gate + compute version metadata
  # ---------------------------------------------------------------------------
  preflight:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_number: ${{ steps.version.outputs.version_number }}
      vscode_version: ${{ steps.version.outputs.vscode_version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Verify release content sync
        run: bun run release-content:check

      - name: Replay gate before release
        run: bun --cwd packages/opencode run test:anthropic:replay

      - name: Determine version
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_PRERELEASE: ${{ github.event.inputs.prerelease }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "version=$INPUT_VERSION" >> $GITHUB_OUTPUT
            echo "prerelease=$INPUT_PRERELEASE" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
            if [[ "${GITHUB_REF#refs/tags/}" == *"-"* ]]; then
              echo "prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

          VER="$(grep -oP '"version":\s*"\K[^"]+' packages/opencode/package.json)"
          echo "version_number=$VER" >> $GITHUB_OUTPUT

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            RAW_VERSION="$INPUT_VERSION"
          else
            RAW_VERSION="${GITHUB_REF#refs/tags/}"
          fi
          CLEAN_VERSION="${RAW_VERSION#v}"
          VSCODE_VERSION=$(node -e '
            const v = process.argv[1];
            const parts = v.split(".");
            if (parts.length === 4) {
              const [year, month, day, build] = parts;
              console.log(year + "." + (parseInt(month) * 100 + parseInt(day)) + "." + build);
            } else {
              console.log(v);
            }
          ' "$CLEAN_VERSION")
          echo "vscode_version=$VSCODE_VERSION" >> $GITHUB_OUTPUT

  # ---------------------------------------------------------------------------
  # 2.  Build per-platform VSCode extensions (parallel matrix)
  # ---------------------------------------------------------------------------
  build-vscode:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            build_os: win32
            build_arch: x64
          - target: darwin-x64
            build_os: darwin
            build_arch: x64
          - target: darwin-arm64
            build_os: darwin
            build_arch: arm64
          - target: linux-x64
            build_os: linux
            build_arch: x64
          - target: linux-arm64
            build_os: linux
            build_arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: |
            hosts/vscode-plugin/pnpm-lock.yaml
            hosts/vscode-plugin/package.json

      - name: Inject VSCode version
        run: |
          node -e '
            const fs = require("fs");
            const path = "hosts/vscode-plugin/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("Updated " + path + " to version " + process.argv[1]);
          ' "${{ needs.preflight.outputs.vscode_version }}"

      - name: Inject WebGUI version for VSCode build
        run: |
          node -e '
            const fs = require("fs");
            const path = "packages/opencode/webgui/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("Updated " + path + " to version " + process.argv[1]);
          ' "${{ needs.preflight.outputs.vscode_version }}"

      - name: Build backend binary (${{ matrix.target }})
        run: |
          cd packages/opencode
          bun script/build.ts --include-target="${{ matrix.build_os }}-${{ matrix.build_arch }}"
        env:
          OPENCODE_VERSION: ${{ needs.preflight.outputs.version_number }}

      - name: Copy binary to VSCode resources
        run: |
          BUILD_OS="${{ matrix.build_os }}"
          BUILD_ARCH="${{ matrix.build_arch }}"
          VSCODE_BIN_DIR="hosts/vscode-plugin/resources/bin"

          # Clear previous binaries
          rm -rf "$VSCODE_BIN_DIR"
          mkdir -p "$VSCODE_BIN_DIR"

          DIST_DIR="packages/opencode/dist"
          for dir in "$DIST_DIR"/opencode-*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            suffix="${name#opencode-}"

            # Skip baseline builds
            case "$suffix" in *baseline*) continue ;; esac

            os="${suffix%%-*}"
            arch="${suffix#${os}-}"

            os_dir="$os"
            [ "$os_dir" = "darwin" ] && os_dir="macos"

            arch_dir="$arch"
            [ "$arch_dir" = "x64" ] && arch_dir="amd64"

            binary_name="opencode"
            [ "$os" = "windows" ] && binary_name="opencode.exe"

            binary_src="$dir/bin/$binary_name"
            [ -f "$binary_src" ] || continue

            target="$VSCODE_BIN_DIR/$os_dir/$arch_dir"
            mkdir -p "$target"
            cp "$binary_src" "$target/$binary_name"
            [ "$os" != "windows" ] && chmod +x "$target/$binary_name"

            echo "=> Prepared VSCode binary for $os/$arch"
          done

      - name: Install VSCode plugin dependencies
        working-directory: hosts/vscode-plugin
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            npm ci
          fi

      - name: Compile VSCode plugin TypeScript
        working-directory: hosts/vscode-plugin
        run: |
          if [ -f pnpm-lock.yaml ]; then
            pnpm run compile:production
          else
            npm run compile:production
          fi

      - name: Package VSCode plugin for ${{ matrix.target }}
        working-directory: hosts/vscode-plugin
        run: |
          STAGE_DIR="../tmp_opencode_vscode_stage"
          rm -rf "$STAGE_DIR"
          mkdir -p "$STAGE_DIR"

          # Copy minimal required files
          cp package.json "$STAGE_DIR/"
          cp -R out "$STAGE_DIR/out"
          cp -R resources "$STAGE_DIR/resources"
          [ -f README.md ] && cp README.md "$STAGE_DIR/" || true
          [ -f CHANGELOG.md ] && cp CHANGELOG.md "$STAGE_DIR/" || true
          [ -f ../../LICENSE ] && cp ../../LICENSE "$STAGE_DIR/" || true

          # Sanitize package.json: remove scripts and devDependencies
          node -e '
            const fs=require("fs");
            const path=require("path");
            const pkgPath=path.resolve(process.cwd(), "../tmp_opencode_vscode_stage/package.json");
            const pkg=JSON.parse(fs.readFileSync(pkgPath, "utf8"));
            delete pkg.scripts;
            delete pkg.devDependencies;
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2));
          '

          # Package with --target for platform-specific vsix
          ( cd "$STAGE_DIR" && npx -y @vscode/vsce package \
              --no-dependencies \
              --target "${{ matrix.target }}" \
              --out "opencode-${{ matrix.target }}.vsix" )

          mv "$STAGE_DIR"/*.vsix .
          rm -rf "$STAGE_DIR"

      - name: Upload VSCode artifact
        uses: actions/upload-artifact@v4
        with:
          name: vscode-${{ matrix.target }}
          path: hosts/vscode-plugin/opencode-${{ matrix.target }}.vsix
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 3.  Build per-platform JetBrains plugins (parallel matrix)
  # ---------------------------------------------------------------------------
  build-jetbrains:
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: windows-x64
            build_os: win32
            build_arch: x64
            os_dir: windows
            arch_dir: amd64
            binary: opencode.exe
          - label: macos-x64
            build_os: darwin
            build_arch: x64
            os_dir: macos
            arch_dir: amd64
            binary: opencode
          - label: macos-arm64
            build_os: darwin
            build_arch: arm64
            os_dir: macos
            arch_dir: arm64
            binary: opencode
          - label: linux-x64
            build_os: linux
            build_arch: x64
            os_dir: linux
            arch_dir: amd64
            binary: opencode
          - label: linux-arm64
            build_os: linux
            build_arch: arm64
            os_dir: linux
            arch_dir: arm64
            binary: opencode

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: ./.github/actions/setup-bun

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Inject JetBrains version
        run: |
          RAW_VERSION="${{ needs.preflight.outputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          sed -i "s/^version = findProperty(\"plugin.version\")?.toString() ?: \".*\"/version = findProperty(\"plugin.version\")?.toString() ?: \"$CLEAN_VERSION\"/" hosts/jetbrains-plugin/build.gradle.kts
          echo "Updated hosts/jetbrains-plugin/build.gradle.kts to version $CLEAN_VERSION"

      - name: Inject WebGUI version for JetBrains build
        run: |
          RAW_VERSION="${{ needs.preflight.outputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          node -e '
            const fs = require("fs");
            const path = "packages/opencode/webgui/package.json";
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"));
            pkg.version = process.argv[1];
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + "\n");
            console.log("Updated " + path + " to version " + process.argv[1]);
          ' "$CLEAN_VERSION"

      - name: Build single-target backend binary
        run: |
          cd packages/opencode
          rm -rf dist
          bun script/build.ts --include-target="${{ matrix.build_os }}-${{ matrix.build_arch }}"
        env:
          OPENCODE_VERSION: ${{ needs.preflight.outputs.version_number }}

      - name: Verify JetBrains build WebGUI version injection
        run: |
          RAW_VERSION="${{ needs.preflight.outputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          node -e '
            const fs = require("fs");
            const path = require("path");
            const dir = "packages/opencode/webgui-dist/assets";
            const expected = process.argv[1];
            const files = fs.readdirSync(dir).filter((name) => name.endsWith(".js"));
            if (files.length === 0) {
              throw new Error("missing built webgui js assets");
            }
            const matched = files.some((name) => fs.readFileSync(path.join(dir, name), "utf8").includes(expected));
            if (!matched) {
              throw new Error(`built webgui assets do not contain ${expected}`);
            }
            console.log("jetbrains webgui version injection ok");
          ' "$CLEAN_VERSION"

      - name: Copy binary to JetBrains resources
        run: |
          JETBRAINS_BIN_DIR="hosts/jetbrains-plugin/src/main/resources/bin"
          rm -rf "$JETBRAINS_BIN_DIR"
          mkdir -p "$JETBRAINS_BIN_DIR/${{ matrix.os_dir }}/${{ matrix.arch_dir }}"

          DIST_DIR="packages/opencode/dist"
          for dir in "$DIST_DIR"/opencode-*; do
            [ -d "$dir" ] || continue
            name="$(basename "$dir")"
            # Skip baseline builds
            case "$name" in *baseline*) continue ;; esac

            binary_src="$dir/bin/${{ matrix.binary }}"
            [ -f "$binary_src" ] || continue

            cp "$binary_src" "$JETBRAINS_BIN_DIR/${{ matrix.os_dir }}/${{ matrix.arch_dir }}/${{ matrix.binary }}"
            [ "${{ matrix.build_os }}" != "win32" ] && chmod +x "$JETBRAINS_BIN_DIR/${{ matrix.os_dir }}/${{ matrix.arch_dir }}/${{ matrix.binary }}"
            echo "=> Prepared JetBrains binary for ${{ matrix.label }}"
            break
          done

      - name: Build JetBrains plugin (${{ matrix.label }})
        working-directory: hosts/jetbrains-plugin
        run: gradle buildPlugin -x test -x unitTest

      - name: Rename JetBrains zip with platform label
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          for f in hosts/jetbrains-plugin/build/distributions/*.zip; do
            [ -f "$f" ] || continue
            mv "$f" "hosts/jetbrains-plugin/build/distributions/opencode-jetbrains-${{ matrix.label }}-${VERSION}.zip"
          done

      - name: Upload JetBrains artifact
        uses: actions/upload-artifact@v4
        with:
          name: jetbrains-${{ matrix.label }}
          path: hosts/jetbrains-plugin/build/distributions/opencode-jetbrains-*.zip
          retention-days: 1

  # ---------------------------------------------------------------------------
  # 4.  Publish VSCode Marketplace packages from existing VSIX artifacts
  # ---------------------------------------------------------------------------
  publish-vscode-marketplace:
    needs: [preflight, build-vscode]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      VSCODE_VERSION: ${{ needs.preflight.outputs.vscode_version }}
      VSCODE_PRERELEASE: ${{ needs.preflight.outputs.prerelease }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install vsce
        run: npm install -g @vscode/vsce

      - name: Assert VSCode Marketplace secret is present
        run: |
          test -n "$VSCE_PAT" || { echo "::error::VSCE_PAT is required"; exit 1; }

      - name: Download VSCode artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vscode-*
          path: vscode-marketplace-artifacts
          merge-multiple: true

      - name: Verify VSCode Marketplace publish inputs
        run: |
          python <<'PY'
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          version = os.environ["VSCODE_VERSION"]
          if not re.fullmatch(r"\d+\.\d+\.\d+", version):
              raise SystemExit(f"VSCode Marketplace version must be major.minor.patch, got {version}")

          repo_pkg = json.loads(Path("hosts/vscode-plugin/package.json").read_text(encoding="utf-8"))
          if repo_pkg.get("publisher") != "caiqy":
              raise SystemExit(f"Unexpected publisher in hosts/vscode-plugin/package.json: {repo_pkg.get('publisher')}")
          if repo_pkg.get("name") != "opencode-ui":
              raise SystemExit(f"Unexpected extension name in hosts/vscode-plugin/package.json: {repo_pkg.get('name')}")

          expected = {
              "opencode-win32-x64.vsix": "resources/bin/windows/amd64/opencode.exe",
              "opencode-darwin-x64.vsix": "resources/bin/macos/amd64/opencode",
              "opencode-darwin-arm64.vsix": "resources/bin/macos/arm64/opencode",
              "opencode-linux-x64.vsix": "resources/bin/linux/amd64/opencode",
              "opencode-linux-arm64.vsix": "resources/bin/linux/arm64/opencode",
          }

          root = Path("vscode-marketplace-artifacts")
          actual = {path.name for path in root.glob("*.vsix")}
          if actual != set(expected):
              raise SystemExit(f"Expected VSIX files {sorted(expected)}, got {sorted(actual)}")

          for name, binary in expected.items():
              with zipfile.ZipFile(root / name) as archive:
                  pkg = json.loads(archive.read("extension/package.json"))
                  if pkg.get("publisher") != "caiqy":
                      raise SystemExit(f"{name} has unexpected publisher {pkg.get('publisher')}")
                  if pkg.get("name") != "opencode-ui":
                      raise SystemExit(f"{name} has unexpected extension name {pkg.get('name')}")
                  if pkg.get("version") != version:
                      raise SystemExit(f"{name} has version {pkg.get('version')} but expected {version}")

                  entries = {
                      item.removeprefix("extension/")
                      for item in archive.namelist()
                      if item.startswith("extension/resources/bin/") and not item.endswith("/")
                  }
                  if entries != {binary}:
                      raise SystemExit(f"{name} should contain only {binary}, got {sorted(entries)}")

          print("vscode marketplace publish inputs ok")
          PY

      - name: Publish VSCode Marketplace packages
        run: |
          prerelease_args=()
          if [ "$VSCODE_PRERELEASE" = "true" ]; then
            prerelease_args+=(--pre-release)
          fi

          for vsix in \
            vscode-marketplace-artifacts/opencode-win32-x64.vsix \
            vscode-marketplace-artifacts/opencode-darwin-x64.vsix \
            vscode-marketplace-artifacts/opencode-darwin-arm64.vsix \
            vscode-marketplace-artifacts/opencode-linux-x64.vsix \
            vscode-marketplace-artifacts/opencode-linux-arm64.vsix
          do
            echo "Publishing $(basename "$vsix")"
            vsce publish "${prerelease_args[@]}" --packagePath "$vsix"
          done

  # ---------------------------------------------------------------------------
  # 5.  Publish JetBrains Marketplace package
  # ---------------------------------------------------------------------------
  publish-jetbrains-marketplace:
    needs: [preflight, build-jetbrains]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
      JETBRAINS_CERTIFICATE_CHAIN: ${{ secrets.JETBRAINS_CERTIFICATE_CHAIN }}
      JETBRAINS_PRIVATE_KEY: ${{ secrets.JETBRAINS_PRIVATE_KEY }}
      JETBRAINS_PRIVATE_KEY_PASSWORD: ${{ secrets.JETBRAINS_PRIVATE_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assert Marketplace secrets are present
        run: |
          test -n "$JETBRAINS_MARKETPLACE_TOKEN" || { echo "::error::JETBRAINS_MARKETPLACE_TOKEN is required"; exit 1; }
          test -n "$JETBRAINS_CERTIFICATE_CHAIN" || { echo "::error::JETBRAINS_CERTIFICATE_CHAIN is required"; exit 1; }
          test -n "$JETBRAINS_PRIVATE_KEY" || { echo "::error::JETBRAINS_PRIVATE_KEY is required"; exit 1; }
          test -n "$JETBRAINS_PRIVATE_KEY_PASSWORD" || { echo "::error::JETBRAINS_PRIVATE_KEY_PASSWORD is required"; exit 1; }

      - name: Download Windows x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-windows-x64
          path: marketplace-artifacts/windows-x64

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-macos-arm64
          path: marketplace-artifacts/macos-arm64

      - name: Download Linux x64 artifact
        uses: actions/download-artifact@v4
        with:
          name: jetbrains-linux-x64
          path: marketplace-artifacts/linux-x64

      - name: Rebuild Marketplace binary bundle from selected plugin zips
        run: |
          python <<'PY'
          import io
          import shutil
          import zipfile
          from pathlib import Path

          artifact_root = Path("marketplace-artifacts")
          target_root = Path("hosts/jetbrains-plugin/src/main/resources/bin")
          if target_root.exists():
              shutil.rmtree(target_root)

          targets = [
              ("windows-x64", "windows", "amd64", "opencode.exe"),
              ("macos-arm64", "macos", "arm64", "opencode"),
              ("linux-x64", "linux", "amd64", "opencode"),
          ]

          for label, os_dir, arch_dir, binary in targets:
              archives = sorted((artifact_root / label).glob("*.zip"))
              if len(archives) != 1:
                  raise SystemExit(f"Expected exactly one archive for {label}, found {len(archives)}")

              entry = f"bin/{os_dir}/{arch_dir}/{binary}"
              output = target_root / os_dir / arch_dir / binary
              output.parent.mkdir(parents=True, exist_ok=True)

              found = False
              with zipfile.ZipFile(archives[0]) as plugin_zip:
                  for member in plugin_zip.namelist():
                      if not member.endswith(".jar"):
                          continue
                      payload = plugin_zip.read(member)
                      with zipfile.ZipFile(io.BytesIO(payload)) as jar_zip:
                          try:
                              output.write_bytes(jar_zip.read(entry))
                              found = True
                              break
                          except KeyError:
                              continue

              if not found:
                  raise SystemExit(f"Missing {entry} inside {archives[0]}")
          PY

      - name: Verify Marketplace binary bundle
        run: |
          test -f hosts/jetbrains-plugin/src/main/resources/bin/windows/amd64/opencode.exe
          test -f hosts/jetbrains-plugin/src/main/resources/bin/macos/arm64/opencode
          test -f hosts/jetbrains-plugin/src/main/resources/bin/linux/amd64/opencode
          chmod +x hosts/jetbrains-plugin/src/main/resources/bin/macos/arm64/opencode
          chmod +x hosts/jetbrains-plugin/src/main/resources/bin/linux/amd64/opencode

      - name: Build Marketplace plugin package
        working-directory: hosts/jetbrains-plugin
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          CLEAN_VERSION="${VERSION#v}"
          chmod +x gradlew
          ./gradlew clean buildPlugin \
            -Pplugin.version="$CLEAN_VERSION" \
            -Pdistribution.channel="marketplace" \
            -x test \
            -x unitTest

      - name: Verify Marketplace plugin metadata
        run: |
          python <<'PY'
          import io
          import re
          import zipfile
          from pathlib import Path

          archives = sorted(Path("hosts/jetbrains-plugin/build/distributions").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one Marketplace zip, found {len(archives)}")

          plugin_xml = None
          with zipfile.ZipFile(archives[0]) as plugin_zip:
              for member in plugin_zip.namelist():
                  if not member.endswith(".jar"):
                      continue
                  payload = plugin_zip.read(member)
                  with zipfile.ZipFile(io.BytesIO(payload)) as jar_zip:
                      try:
                          plugin_xml = jar_zip.read("META-INF/plugin.xml").decode("utf-8")
                          break
                      except KeyError:
                          continue

          if plugin_xml is None:
              raise SystemExit("Could not find META-INF/plugin.xml inside Marketplace package")

          if "<vendor>Caiqy</vendor>" not in plugin_xml:
              raise SystemExit("Marketplace package missing Caiqy vendor")

          match = re.search(r"<description><!\[CDATA\[(.*?)\]\]></description>", plugin_xml, re.S)
          if not match:
              raise SystemExit("Marketplace package missing plugin description")

          description = match.group(1).strip()
          visible = re.sub(r"<[^>]+>", " ", description)
          visible = re.sub(r"\s+", " ", visible).strip()

          if not description.startswith("OpenCode UI"):
              raise SystemExit("Marketplace description must start with Latin characters")
          if len(visible) < 40:
              raise SystemExit("Marketplace description visible text is shorter than 40 characters")
          if "GUI only" in description:
              raise SystemExit("Marketplace description still mentions stale GUI-only variant")
          if "src/main/resources/bin" in description:
              raise SystemExit("Marketplace description exposes source path instead of runtime behavior")

          print("marketplace metadata ok")
          PY

      - name: Verify JetBrains build WebGUI version injection
        run: |
          RAW_VERSION="${{ needs.preflight.outputs.version }}"
          CLEAN_VERSION="${RAW_VERSION#v}"
          export CLEAN_VERSION
          python <<'PY'
          import io
          import os
          import zipfile
          from pathlib import Path

          expected = os.environ["CLEAN_VERSION"]
          archives = sorted(Path("hosts/jetbrains-plugin/build/distributions").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one Marketplace zip, found {len(archives)}")

          plugin_xml = None
          with zipfile.ZipFile(archives[0]) as plugin_zip:
              for member in plugin_zip.namelist():
                  if not member.endswith(".jar"):
                      continue
                  payload = plugin_zip.read(member)
                  with zipfile.ZipFile(io.BytesIO(payload)) as jar_zip:
                      try:
                          plugin_xml = jar_zip.read("META-INF/plugin.xml").decode("utf-8")
                          break
                      except KeyError:
                          continue

          if plugin_xml is None:
              raise SystemExit("Could not find META-INF/plugin.xml inside Marketplace package")
          if f"<version>{expected}</version>" not in plugin_xml:
              raise SystemExit(f"Marketplace package version does not match clean tag version {expected}")

          print("jetbrains webgui clean version semantics ok")
          PY

      - name: Verify Marketplace distribution channel metadata
        run: |
          python <<'PY'
          import io
          import zipfile
          from pathlib import Path

          archives = sorted(Path("hosts/jetbrains-plugin/build/distributions").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one Marketplace zip, found {len(archives)}")

          props = None
          with zipfile.ZipFile(archives[0]) as plugin_zip:
              for member in plugin_zip.namelist():
                  if not member.endswith(".jar"):
                      continue
                  payload = plugin_zip.read(member)
                  with zipfile.ZipFile(io.BytesIO(payload)) as jar_zip:
                      try:
                          props = jar_zip.read("opencode-build.properties").decode("utf-8")
                          break
                      except KeyError:
                          continue

          if props is None:
              raise SystemExit("Could not find opencode-build.properties inside Marketplace package")
          if "distribution.channel=marketplace" not in props:
              raise SystemExit(f"Marketplace package has wrong distribution channel: {props!r}")

          print("marketplace distribution channel ok")
          PY

      - name: Verify Marketplace package contains only 3 binaries
        run: |
          python <<'PY'
          import io
          import zipfile
          from pathlib import Path

          archives = sorted(Path("hosts/jetbrains-plugin/build/distributions").glob("*.zip"))
          if len(archives) != 1:
              raise SystemExit(f"Expected exactly one Marketplace zip, found {len(archives)}")

          expected = {
              "bin/windows/amd64/opencode.exe",
              "bin/macos/arm64/opencode",
              "bin/linux/amd64/opencode",
          }

          actual = None
          with zipfile.ZipFile(archives[0]) as plugin_zip:
              for member in plugin_zip.namelist():
                  if not member.endswith(".jar"):
                      continue
                  payload = plugin_zip.read(member)
                  with zipfile.ZipFile(io.BytesIO(payload)) as jar_zip:
                      entries = {name for name in jar_zip.namelist() if name.startswith("bin/") and not name.endswith("/")}
                      if expected.issubset(entries):
                          actual = entries
                          break

          if actual is None:
              raise SystemExit(f"Could not find bundled binaries inside {archives[0]}")

          if actual != expected:
              raise SystemExit(f"Expected only {sorted(expected)}, got {sorted(actual)}")

          print("marketplace bundle contents ok")
          PY

      - name: Sign and publish Marketplace plugin
        working-directory: hosts/jetbrains-plugin
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          CLEAN_VERSION="${VERSION#v}"
          chmod +x gradlew
          ./gradlew signPlugin publishPlugin \
            -Pplugin.version="$CLEAN_VERSION" \
            -Pdistribution.channel="marketplace" \
            -x test \
            -x unitTest

  # ---------------------------------------------------------------------------
  # 6.  Collect all artifacts and publish a single GitHub Release
  # ---------------------------------------------------------------------------
  release:
    needs: [preflight, build-vscode, build-jetbrains]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all VSCode artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vscode-*
          path: release-artifacts
          merge-multiple: true

      - name: Download all JetBrains artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jetbrains-*
          path: jb-tmp
          merge-multiple: true

      - name: Rename artifacts
        run: |
          VERSION="${{ needs.preflight.outputs.version }}"
          mkdir -p release-artifacts

          # Rename VSCode extensions (already named opencode-<target>.vsix)
          for f in release-artifacts/opencode-*.vsix; do
            [ -f "$f" ] || continue
            base="$(basename "$f" .vsix)"
            target="${base#opencode-}"
            mv "$f" "release-artifacts/opencode-vscode-${target}-${VERSION}.vsix"
          done

          # Move JetBrains plugins (already named with platform label and version)
          for f in jb-tmp/*.zip; do
            [ -f "$f" ] || continue
            mv "$f" "release-artifacts/$(basename "$f")"
          done

          ls -la release-artifacts/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.preflight.outputs.version }}
          name: OpenCode Release ${{ needs.preflight.outputs.version }}
          prerelease: ${{ needs.preflight.outputs.prerelease }}
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## OpenCode Release ${{ needs.preflight.outputs.version }}

            Each package bundles **only the binary for its platform**, keeping download sizes small.

            ### VSCode Extension
            | Platform | File |
            |----------|------|
            | Windows x64 | `opencode-vscode-win32-x64-${{ needs.preflight.outputs.version }}.vsix` |
            | macOS x64 | `opencode-vscode-darwin-x64-${{ needs.preflight.outputs.version }}.vsix` |
            | macOS ARM64 | `opencode-vscode-darwin-arm64-${{ needs.preflight.outputs.version }}.vsix` |
            | Linux x64 | `opencode-vscode-linux-x64-${{ needs.preflight.outputs.version }}.vsix` |
            | Linux ARM64 | `opencode-vscode-linux-arm64-${{ needs.preflight.outputs.version }}.vsix` |

            Install: `code --install-extension <file>.vsix`

            ### JetBrains Plugin
            Each JetBrains zip bundles only its platform binary.

            Install: Settings → Plugins → Install Plugin from Disk → select the zip.

            ### What's Changed
            See the auto-generated release notes below for detailed changes.

  # ---------------------------------------------------------------------------
  # 7.  Post-release artifact verification
  # ---------------------------------------------------------------------------
  test-artifacts:
    runs-on: ubuntu-latest
    needs: release
    if: always() && needs.release.result != 'skipped'
    steps:
      - name: Download VSCode artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: vscode-*
          path: ./test-artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Download JetBrains artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: jetbrains-*
          path: ./test-artifacts
          merge-multiple: true
        continue-on-error: true

      - name: Verify artifacts
        run: |
          echo "Checking release artifacts..."
          ls -la ./test-artifacts/ || echo "No artifacts found"

          MISSING=0
          for target in win32-x64 darwin-x64 darwin-arm64 linux-x64 linux-arm64; do
            if ls ./test-artifacts/opencode-*${target}*.vsix 1>/dev/null 2>&1; then
              echo "✓ VSCode extension ($target) found"
            else
              echo "✗ VSCode extension ($target) missing"
              MISSING=1
            fi
          done

          for label in windows-x64 macos-x64 macos-arm64 linux-x64 linux-arm64; do
            if ls ./test-artifacts/opencode-jetbrains-${label}*.zip 1>/dev/null 2>&1; then
              echo "✓ JetBrains plugin ($label) found"
            else
              echo "✗ JetBrains plugin ($label) missing"
              MISSING=1
            fi
          done

          if [ "$MISSING" -eq 1 ]; then
            echo "::error::Some release artifacts are missing!"
            exit 1
          fi
